name: CI

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup and install
        uses: Automattic/vip-actions/nodejs-setup@trunk
        with:
          node-version-file: .nvmrc

      - name: Run linter
        run: npm run lint

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup and install
        uses: Automattic/vip-actions/nodejs-setup@trunk
        with:
          node-version-file: .nvmrc

      - name: Check types
        run: npm run check-types

  dependaban:
    name: Dependaban
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: Automattic/vip-actions/dependaban@trunk

  jest:
    name: Jest tests (ESLint ${{ matrix.eslint }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - lint
      - check-types
    strategy:
      fail-fast: false
      matrix:
        node:
          - version-file: .nvmrc
            version-name: pinned
        # The minimum supported version of each major (see peerDependencies).
        # The latest release is covered by the lockfile in the other jobs.
        eslint:
          - 9.39.1
          - 10.0.0
    steps:
      - name: Setup and install
        uses: Automattic/vip-actions/nodejs-setup@trunk
        with:
          node-version-file: .nvmrc

      - name: Install ESLint ${{ matrix.eslint }}
        run: npm install --no-save --no-audit --no-fund eslint@${{ matrix.eslint }}

      - name: Run tests
        run: npm test
